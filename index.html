<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatpata Cart</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7f2;color:#222}header{background:#19a463;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:5}.hero{text-align:center;padding:25px;background:#fff3a8}.search{padding:12px;width:80%;max-width:600px;border-radius:20px;border:1px solid #ccc}.cats{text-align:center;padding:15px}.cats button,.add,.cart,.adminBtn,.status{padding:9px 13px;margin:4px;border:0;border-radius:18px;background:#19a463;color:white;cursor:pointer}.adminBtn{background:#123d29}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;padding:20px}.card{background:white;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001}.pic{font-size:55px;text-align:center;background:#effff2;padding:15px}.price{font-weight:bold;color:#159457;margin:8px 0}.panel{position:fixed;right:-420px;top:0;width:min(400px,100%);height:100%;background:white;padding:20px;box-shadow:-3px 0 15px #0003;transition:.3s;overflow:auto;z-index:10;box-sizing:border-box}.panel.open{right:0}.item{padding:12px;border-bottom:1px solid #ddd}.modal{display:none;position:fixed;inset:0;background:#0008;place-items:center;z-index:20}.modal.show{display:grid}.box{background:white;padding:22px;width:min(500px,90%);max-height:90vh;overflow:auto;border-radius:14px}.input{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}.orderCard{background:#f7faf7;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}.new{border-left:6px solid #e9a400}.badge{display:inline-block;padding:4px 8px;border-radius:10px;background:#e9f7ee}.notify{background:#fff3cd;padding:10px;border-radius:10px;margin:10px 0}footer{text-align:center;background:#123d29;color:white;padding:20px}
</style></head>
<body><header><h2>🌶️ Chatpata Cart</h2><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button> <button class="adminBtn" onclick="openAdmin()">🔔 Admin Orders <span id="orderCount">0</span></button></header>
<section class="hero"><h1>Grocery & Pani Puri Items</h1><p>Sab Kuch Ek Jagah!</p><input id="search" class="search" placeholder="Search atta, maida, chini..." oninput="render()"></section>
<div class="cats"><button onclick="setCat('All')">All</button><button onclick="setCat('Grocery')">🌾 Grocery</button><button onclick="setCat('Pani Puri')">🥟 Pani Puri</button><button onclick="setCat('Masala')">🌶️ Masala</button><button onclick="setCat('Packaging')">🥣 Packaging</button></div>
<div id="products" class="grid"></div>
<div id="panel" class="panel"><button onclick="closeCart()">✕</button><h2>🛒 Cart</h2><div id="items"></div><h2>Total ₹<span id="total">0</span></h2><button class="add" onclick="checkout()">Checkout</button></div>
<div id="modal" class="modal"><div class="box"><button onclick="closeModal()">✕</button><h2>📦 Checkout</h2><input id="name" class="input" placeholder="Name"><input id="phone" class="input" placeholder="Mobile"><textarea id="address" class="input" placeholder="Delivery Address"></textarea><p><b>Payment</b></p><label><input type="radio" name="pay" value="COD" checked> 💵 COD</label><br><label><input type="radio" name="pay" value="UPI"> 📱 UPI Demo</label><br><br><button class="add" onclick="order()">Place Order</button><div id="result"></div></div></div>
<div id="adminModal" class="modal"><div class="box"><button onclick="closeAdmin()">✕</button><h2>🔔 Admin Order Panel</h2><div class="notify">New customer orders will appear here. Click <b>Allow notifications</b> to enable browser alerts.</div><button class="add" onclick="enableNotifications()">🔔 Allow notifications</button> <button onclick="clearOrders()">Clear Demo Orders</button><hr><div id="orders"></div></div></div>
<footer>© 2026 Chatpata Cart</footer>
<script>
const ONLINE_API_URL = "const ONLINE_API_URL = "https://script.google.com/macros/s/AKfycbwnrBgeC8ZiytDiLsTRfAQpqVnboN7srhLQTGafQNWADFK_AZygcZvI4EEVlRaL6pFR/exec";

const P=[[1,'Atta',45,'Grocery','🌾'],[2,'Maida',40,'Grocery','🥣'],[3,'Suji',50,'Grocery','🌾'],[4,'Besan',70,'Grocery','🫘'],[5,'Chini',48,'Grocery','🍚'],[6,'Chawal',65,'Grocery','🍚'],[7,'Dal',90,'Grocery','🫘'],[8,'Namak',25,'Grocery','🧂'],[9,'Pani Puri',30,'Pani Puri','🥟'],[10,'Pani Puri Masala',55,'Masala','🌶️'],[11,'Imli Chutney',60,'Masala','🥭'],[12,'Pudina Masala',45,'Masala','🌿'],[13,'Dona',35,'Packaging','🥣'],[14,'Spoon',25,'Packaging','🥄'],[15,'Paper Plate',50,'Packaging','🍽️']];
let cart=[],cat='All';
function setCat(x){cat=x;render()}function render(){let q=document.getElementById('search').value.toLowerCase();document.getElementById('products').innerHTML=P.filter(p=>(cat=='All'||p[3]==cat)&&p[1].toLowerCase().includes(q)).map(p=>`<div class="card"><div class="pic">${p[4]}</div><h3>${p[1]}</h3><small>${p[3]}</small><div class="price">₹${p[2]}</div><button class="add" onclick="add(${p[0]})">+ Add to Cart</button></div>`).join('')}
function add(id){let x=cart.find(a=>a.id==id);x?x.q++:cart.push({id:id,q:1});update();openCart()}function change(id,n){let x=cart.find(a=>a.id==id);x.q+=n;if(x.q<1)cart=cart.filter(a=>a.id!=id);update()}function update(){let t=0,c=0;document.getElementById('items').innerHTML=cart.map(a=>{let p=P.find(x=>x[0]==a.id),s=p[2]*a.q;t+=s;c+=a.q;return `<div class="item">${p[4]} <b>${p[1]}</b> ₹${s}<br><button onclick="change(${a.id},-1)">−</button> ${a.q} <button onclick="change(${a.id},1)">+</button></div>`}).join('')||'<p>Cart empty</p>';document.getElementById('total').textContent=t;document.getElementById('count').textContent=c}
function openCart(){document.getElementById('panel').classList.add('open')}function closeCart(){document.getElementById('panel').classList.remove('open')}function checkout(){if(!cart.length)return alert('Cart empty');document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}
function getOrders(){return JSON.parse(localStorage.getItem('cc_orders')||'[]')}function saveOrders(o){localStorage.setItem('cc_orders',JSON.stringify(o))}
async function order(){if(!document.getElementById('name').value.trim()||!document.getElementById('phone').value.trim()||!document.getElementById('address').value.trim())return alert('Please fill all details');let id='CC'+Math.floor(100000+Math.random()*900000),payment=document.querySelector('input[name=pay]:checked').value;let total=cart.reduce((s,a)=>s+P.find(p=>p[0]==a.id)[2]*a.q,0);let items=cart.map(a=>{let p=P.find(x=>x[0]==a.id);return {name:p[1],qty:a.q,price:p[2]}});let o={id,name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),address:document.getElementById('address').value.trim(),payment,total,items,status:'New',time:new Date().toLocaleString()};let orders=getOrders();orders.unshift(o);saveOrders(orders);if(ONLINE_API_URL){try{await fetch(ONLINE_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)});}catch(e){console.warn('Online sync failed',e);}}document.getElementById('result').innerHTML=`<h3>🎉 Order Placed!</h3><p>Order ID: <b>${id}</b></p><p>Payment: ${payment}</p><p>${ONLINE_API_URL?'Order sent to store.':'Demo order saved in this browser.'}</p>`;cart=[];update();renderOrders();updateOrderCount();tryNotify(o);}
function tryNotify(o){if('Notification' in window&&Notification.permission==='granted')new Notification('🌶️ New Chatpata Cart Order',{body:`${o.id} • ₹${o.total} • ${o.name}`})}
function enableNotifications(){if(!('Notification' in window))return alert('Browser notifications are not supported here.');Notification.requestPermission().then(p=>alert(p==='granted'?'Notifications enabled!':'Notification permission not granted.'))}
function openAdmin(){document.getElementById('adminModal').classList.add('show');renderOrders();updateOrderCount()}function closeAdmin(){document.getElementById('adminModal').classList.remove('show')}
function renderOrders(){let os=getOrders();document.getElementById('orders').innerHTML=os.length?os.map((o,i)=>`<div class="orderCard ${o.status==='New'?'new':''}"><b>📦 ${o.id}</b> <span class="badge">${o.status}</span><p><b>Customer:</b> ${esc(o.name)}<br><b>Mobile:</b> ${esc(o.phone)}<br><b>Address:</b> ${esc(o.address)}<br><b>Payment:</b> ${o.payment}<br><b>Total:</b> ₹${o.total}<br><b>Time:</b> ${o.time}</p><b>Items:</b><ul>${o.items.map(x=>`<li>${esc(x.name)} × ${x.qty} — ₹${x.price*x.qty}</li>`).join('')}</ul><button class="status" onclick="setStatus(${i},'Accepted')">Accept</button><button class="status" onclick="setStatus(${i},'Preparing')">Preparing</button><button class="status" onclick="setStatus(${i},'Out for Delivery')">Out for Delivery</button><button class="status" onclick="setStatus(${i},'Delivered')">Delivered</button></div>`).join(''):'<p>No orders yet.</p>'}
function setStatus(i,s){let o=getOrders();o[i].status=s;saveOrders(o);renderOrders();updateOrderCount()}function updateOrderCount(){let n=getOrders().filter(o=>o.status==='New').length;document.getElementById('orderCount').textContent=n?`(${n})`:''}function clearOrders(){if(confirm('Delete all demo orders?')){localStorage.removeItem('cc_orders');renderOrders();updateOrderCount()}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();update();renderOrders();updateOrderCount();
</script></body></html>
